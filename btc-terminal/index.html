<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTC//TERMINAL · Project Satoshi</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #0d0f14; --card-bg: #14161f; --border: #1f2233;
  --text: #e0e0e0; --dim: #6b7280; --accent: #f7931a;
  --green: #22c55e; --red: #ef4444; --blue: #3b82f6; --cyan: #06b6d4;
  --warn: #f59e0b; --stale: #9ca3af;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px;
}

/* Staleness banner */
.stale-banner {
  background: rgba(245,158,11,0.15); border: 1px solid var(--warn);
  color: var(--warn); padding: 10px 16px; border-radius: 8px;
  margin-bottom: 16px; font-size: 0.85rem; display: none; align-items: center; gap: 8px;
}
.stale-banner.visible { display: flex; }
.stale-banner.critical { background: rgba(239,68,68,0.15); border-color: var(--red); color: var(--red); }

.header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 28px; flex-wrap: wrap; gap: 12px;
}
.header h1 { font-size: 1.6rem; font-weight: 700; }
.header h1 span { color: var(--accent); }
.header .price { font-size: 2rem; font-weight: 700; color: var(--accent); }
.header .meta { color: var(--dim); font-size: 0.8rem; }
.price-row { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.grid { display: grid; gap: 20px; }
.kpi-row { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.chart-row { grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); }
.full-row { grid-template-columns: 1fr; }
.card {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: 12px; padding: 20px;
}
.card h2 {
  font-size: 0.95rem; font-weight: 600; margin-bottom: 14px;
  color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px;
}
.kpi {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px; text-align: center; position: relative;
}
.kpi .value { font-size: 1.6rem; font-weight: 700; line-height: 1.1; margin: 6px 0; }
.kpi .label { font-size: 0.7rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; }
.kpi .sub { font-size: 0.7rem; color: var(--dim); margin-top: 2px; }
.kpi .source-line { font-size: 0.6rem; color: var(--dim); margin-top: 4px; opacity: 0.6; }

/* Staleness degradation */
.kpi.stale { opacity: 0.5; }
.kpi.stale .value { color: var(--stale) !important; }
.kpi .stale-badge {
  display: none; position: absolute; top: 6px; right: 8px;
  font-size: 0.6rem; background: rgba(156,163,175,0.2); color: var(--stale);
  padding: 2px 6px; border-radius: 4px;
}
.kpi.stale .stale-badge { display: inline-block; }
.kpi .error-badge {
  display: none; position: absolute; top: 6px; right: 8px;
  font-size: 0.6rem; background: rgba(239,68,68,0.2); color: var(--red);
  padding: 2px 6px; border-radius: 4px;
}
.kpi.error { opacity: 0.4; }
.kpi.error .value { color: var(--red) !important; }
.kpi.error .error-badge { display: inline-block; }

.bull { color: var(--green); }
.bear { color: var(--red); }
.neutral { color: var(--cyan); }
.report-box {
  background: rgba(0,0,0,0.3); border: 1px solid var(--border);
  border-radius: 8px; padding: 16px; font-family: 'Courier New', monospace;
  font-size: 0.82rem; line-height: 1.5; max-height: 420px; overflow-y: auto;
  white-space: pre-wrap; color: var(--text);
}
.regime-badge {
  display: inline-block; padding: 4px 12px; border-radius: 8px;
  font-size: 0.85rem; font-weight: 600; text-transform: uppercase;
}
.regime-RANGE_BOUND { background: rgba(59,130,246,0.15); color: var(--blue); }
.regime-BULL_TREND { background: rgba(34,197,94,0.15); color: var(--green); }
.regime-EUPHORIA { background: rgba(234,179,8,0.15); color: #eab308; }
.regime-CAPITULATION { background: rgba(239,68,68,0.2); color: var(--red); }
.regime-ORDERLY_CORRECTION { background: rgba(249,115,22,0.15); color: #f97316; }
.regime-BEAR { background: rgba(239,68,68,0.15); color: var(--red); }
canvas { max-width: 100%; }
.footer {
  text-align: center; color: var(--dim); font-size: 0.7rem;
  margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--border);
}
.footer a { color: var(--accent); text-decoration: none; }
.portal-link {
  display: inline-block; margin-bottom: 20px; font-size: 0.8rem;
  color: var(--dim); text-decoration: none;
}
.portal-link:hover { color: var(--accent); }
.loading { text-align: center; padding: 40px; color: var(--dim); font-size: 1rem; }
</style>
</head>
<body>
<a href="/Pondiki-apps/" class="portal-link">← Pondiki Dashboards</a>

<div class="stale-banner" id="stale-banner">
  <span>⚠️</span><span id="stale-banner-text">Loading...</span>
</div>

<div class="header">
  <div>
    <h1>₿ <span>BTC</span>//TERMINAL</h1>
    <div class="meta" id="meta-line">Project Satoshi · Loading snapshot...</div>
  </div>
  <div class="price-row">
    <span class="price" id="header-price">---</span>
    <span class="regime-badge regime-RANGE_BOUND" id="header-regime">---</span>
  </div>
</div>

<div class="grid kpi-row" id="kpi-row">
  <div class="loading">Loading snapshot.json...</div>
</div>

<div class="grid chart-row" style="margin-top:20px">
  <div class="card">
    <h2>BTC Price — 30 Day History</h2>
    <canvas id="chart-price"></canvas>
  </div>
  <div class="card">
    <h2>Options Term Structure</h2>
    <canvas id="chart-terms"></canvas>
  </div>
</div>

<div class="grid full-row" style="margin-top:20px">
  <div class="card">
    <h2>Regime Analysis</h2>
    <div class="report-box" id="regime-report"></div>
  </div>
</div>

<div class="grid full-row" style="margin-top:20px">
  <div class="card">
    <h2>Full Sentiment Report</h2>
    <div class="report-box" id="sentiment-report">Loading...</div>
  </div>
</div>

<div class="footer">
  BTC//TERMINAL · Project Satoshi · <span id="snapshot-source">---</span> ·
  <a href="/Pondiki-apps/">Portal</a>
</div>

<script>
Chart.defaults.color = '#6b7280';
Chart.defaults.borderColor = '#1f2233';

const SNAPSHOT_URL = "snapshot.json";
const MAX_SNAPSHOT_AGE_MIN = 15;

// ---- Field rendering ----
function fieldStatus(f) { return f && f.status ? f.status : "missing"; }
function fieldValue(f) { return f && f.value != null ? f.value : null; }
function fieldSource(f) { return f ? (f.source || "") : ""; }

function fieldAgeMin(f) {
  if (!f || !f.fetched_at) return null;
  const fetched = Date.parse(f.fetched_at);
  if (isNaN(fetched)) return null;
  return Math.round((Date.now() - fetched) / 60000);
}

function fmtPct(v) { return v != null ? v.toFixed(2) + "%" : "---"; }
function fmtMoney(v) { return v != null ? "$" + Number(v).toLocaleString(undefined, {minimumFractionDigits:0, maximumFractionDigits:0}) : "---"; }
function fmtNum(v, dec) { return v != null ? Number(v).toFixed(dec||0) : "---"; }

function kpiClass(status) {
  if (status === "stale") return "stale";
  if (status === "error" || status === "missing") return "error";
  return "";
}

function kpiBadge(status) {
  if (status === "stale") return '<span class="stale-badge">STALE</span>';
  if (status === "error") return '<span class="error-badge">ERR</span>';
  if (status === "missing") return '<span class="error-badge">N/A</span>';
  return '';
}

// ---- Load & Render ----
async function load() {
  let snap;
  try {
    const resp = await fetch(SNAPSHOT_URL, {cache: "no-store"});
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    snap = await resp.json();
  } catch(e) {
    document.getElementById("kpi-row").innerHTML = '<div class="card" style="grid-column:1/-1;text-align:center;color:var(--red)">✗ Failed to load snapshot.json: ' + e.message + '</div>';
    document.getElementById("stale-banner").className = "stale-banner critical visible";
    document.getElementById("stale-banner-text").textContent = "Cannot load snapshot.json — pipeline may be down";
    return;
  }

  // Schema version check
  const isV2 = snap._schema_version >= 2;
  const fields = isV2 ? snap.fields : null;

  // §5: Snapshot-level age guard
  const genAt = snap.generated_at;
  const genDate = Date.parse(genAt);
  const ageMin = isNaN(genDate) ? null : Math.round((Date.now() - genDate) / 60000);
  
  const banner = document.getElementById("stale-banner");
  const bannerText = document.getElementById("stale-banner-text");
  if (ageMin === null) {
    banner.className = "stale-banner critical visible";
    bannerText.textContent = "⚠ Cannot parse snapshot timestamp — data integrity suspect";
  } else if (ageMin > MAX_SNAPSHOT_AGE_MIN) {
    banner.className = "stale-banner visible" + (ageMin > 60 ? " critical" : "");
    bannerText.textContent = "⚠ STALE — snapshot " + ageMin + " min old" + (ageMin > 60 ? " (over 1 hour!)" : "");
  } else if (ageMin > 5) {
    banner.className = "stale-banner visible";
    bannerText.textContent = "⚠ Snapshot " + ageMin + " min old — may be slightly behind";
  }

  // Meta line
  document.getElementById("meta-line").textContent = 
    "Project Satoshi · Snapshot: " + (genAt || "unknown") + 
    (ageMin != null ? " · Age: " + ageMin + " min" : "");

  // Header price
  const priceField = isV2 ? fields.btc_price : {value: snap.btc_price, status: "ok"};
  document.getElementById("header-price").textContent = fmtMoney(fieldValue(priceField));
  
  const regime = snap.regime || {};
  const regimeName = regime.final_regime || regime.regime || "UNKNOWN";
  const regimeBadge = document.getElementById("header-regime");
  regimeBadge.textContent = regimeName.replace(/_/g, " ");
  regimeBadge.className = "regime-badge regime-" + regimeName;

  // ---- KPI Row ----
  const kpiContainer = document.getElementById("kpi-row");
  
  let kpiHTML = "";
  
  if (isV2) {
    // v2: render from fields map with provenance
    const kpis = [
      {key: "funding_streak_days", label: "Funding Streak", fmt: v => {
        if (v == null) return "---";
        const abs = Math.abs(v);
        return (v < 0 ? "-" : v > 0 ? "+" : "") + abs + "d";
      }, colorFn: v => v != null && v < 0 ? "bear" : "bull"},
      {key: "fear_greed", label: "Fear & Greed", fmt: v => v != null ? v + "/100" : "---",
       colorFn: v => v != null && v <= 25 ? "bear" : v >= 75 ? "bull" : "neutral"},
      {key: "vix", label: "VIX", fmt: v => fmtNum(v, 2), colorFn: v => v > 25 ? "bear" : "neutral"},
      {key: "fed_funds", label: "Fed Funds", fmt: v => fmtPct(v), colorFn: () => ""},
      {key: "ust_10y", label: "10Y Treasury", fmt: v => fmtPct(v), colorFn: () => ""},
    ];
    
    for (const kpi of kpis) {
      const f = fields[kpi.key];
      if (!f) continue;
      const status = fieldStatus(f);
      const val = fieldValue(f);
      const cls = kpiClass(status);
      const colorClass = status === "ok" ? (kpi.colorFn ? kpi.colorFn(val) : "") : "";
      const ageM = fieldAgeMin(f);
      
      // Sub-line: source + age
      let subHTML = "";
      if (status === "ok" && ageM !== null) {
        subHTML = '<div class="source-line">' + f.source + (ageM > 0 ? ' · ' + ageM + 'm ago' : ' · just now') + '</div>';
      } else if (status !== "ok") {
        subHTML = '<div class="source-line">' + f.source + '</div>';
      }
      
      // Classification for F&G
      let subText = "";
      if (kpi.key === "fear_greed" && status === "ok" && val != null) {
        if (val <= 24) subText = "Extreme Fear";
        else if (val <= 49) subText = "Fear";
        else if (val <= 54) subText = "Neutral";
        else if (val <= 74) subText = "Greed";
        else subText = "Extreme Greed";
      }
      
      kpiHTML += '<div class="kpi ' + cls + '">' +
        kpiBadge(status) +
        '<div class="label">' + kpi.label + '</div>' +
        '<div class="value ' + colorClass + '" style="' + (status !== "ok" ? "color:var(--stale)" : "") + '">' + kpi.fmt(val) + '</div>' +
        (subText ? '<div class="sub">' + subText + '</div>' : '') +
        subHTML +
        '</div>';
    }
    
    // PCR from options
    const opts = snap.options || {};
    const pcr = opts.put_call_ratio;
    const pcrInterp = opts.pcr_interpretation || "";
    kpiHTML += '<div class="kpi">' +
      '<div class="label">OI Put/Call Ratio</div>' +
      '<div class="value ' + (pcr != null && pcr > 2.5 ? 'bear' : pcr != null && pcr < 0.8 ? 'bull' : 'neutral') + '">' + (pcr != null ? pcr.toFixed(2) : "---") + '</div>' +
      '<div class="sub">' + pcrInterp + '</div>' +
      '<div class="source-line">deribit options</div>' +
      '</div>';
    
    // Max OI from options
    const maxOI = opts.max_oi;
    if (maxOI && maxOI.put) {
      kpiHTML += '<div class="kpi">' +
        '<div class="label">Max OI Put Wall</div>' +
        '<div class="value" style="color:var(--red)">' + fmtMoney(maxOI.put.strike) + '</div>' +
        '<div class="sub">OI: ' + (maxOI.put.open_interest || 0).toLocaleString() + '</div>' +
        '<div class="source-line">deribit options</div>' +
        '</div>';
    } else {
      kpiHTML += '<div class="kpi">' +
        '<div class="label">Max OI Put Wall</div>' +
        '<div class="value" style="color:var(--stale)">---</div>' +
        '</div>';
    }
    
  } else {
    // v1 fallback (bare scalars in snapshot)
    kpiHTML = '<div class="card" style="grid-column:1/-1;text-align:center;color:var(--warn)">⚠ Snapshot uses legacy v1 format — upgrade pipeline for provenance</div>';
  }
  
  kpiContainer.innerHTML = kpiHTML;

  // ---- Price Chart ----
  const priceHistory = snap.price_history || [];
  if (priceHistory.length > 0) {
    const labels = priceHistory.map(p => p.date);
    const closes = priceHistory.map(p => p.close);
    new Chart(document.getElementById('chart-price'), {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'BTC/USD',
          data: closes,
          borderColor: '#f7931a',
          backgroundColor: 'rgba(247,147,26,0.08)',
          fill: true, tension: 0.3, pointRadius: 0, borderWidth: 2
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { callback: v => '$' + v.toLocaleString() } },
          x: { grid: { display: false } }
        }
      }
    });
  }

  // ---- Term Structure Chart ----
  const optsRaw = snap.options || {};
  const ts = optsRaw.term_structure;
  if (ts && ts.front_month_iv != null && ts.back_month_iv != null) {
    new Chart(document.getElementById('chart-terms'), {
      type: 'bar',
      data: {
        labels: ['Front Month IV', 'Back Month IV'],
        datasets: [{
          label: 'Implied Volatility %',
          data: [ts.front_month_iv, ts.back_month_iv],
          backgroundColor: ['rgba(247,147,26,0.5)', 'rgba(59,130,246,0.5)'],
          borderColor: ['rgba(247,147,26,1)', 'rgba(59,130,246,1)'],
          borderWidth: 1, borderRadius: 6
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: false, grid: { color: 'rgba(255,255,255,0.05)' }, title: { display: true, text: 'IV %', color: '#6b7280' } },
          x: { grid: { display: false } }
        }
      }
    });
  }

  // ---- Regime Report ----
  const checks = regime.checks || [];
  let regimeHTML = '';
  if (checks.length > 0) {
    for (const c of checks) {
      regimeHTML += (c.passed ? '✅' : '⛔') + ' <b>' + c.regime + '</b>: ' + c.reason + '\n';
    }
  } else {
    regimeHTML = regimeName.replace(/_/g, ' ') + ' · Confidence: ' + fmtPct((regime.confidence || 0) * 100) + '\n';
    if (regime.details && regime.details.reason) {
      regimeHTML += 'Reason: ' + regime.details.reason + '\n';
    }
  }
  document.getElementById('regime-report').innerHTML = regimeHTML || 'No regime data';

  // ---- Build text report ----
  let report = "=".repeat(60) + "\n";
  report += "BTC MARKET SENTIMENT REPORT\n";
  report += "Time: " + (genAt || "unknown") + "\n";
  report += "=".repeat(60) + "\n\n";
  
  report += "💰 PRICE: " + fmtMoney(fieldValue(priceField)) + "\n\n";
  
  report += "🎯 REGIME: " + regimeName.replace(/_/g, " ") + "\n";
  report += "   Confidence: " + fmtPct((regime.confidence || 0) * 100) + "\n";
  
  if (isV2) {
    // Provenance-aware report
    report += "\n📊 FIELD STATUS:\n";
    for (const [key, f] of Object.entries(fields)) {
      const status = fieldStatus(f);
      const icon = status === "ok" ? "✅" : status === "stale" ? "⚠️" : "❌";
      const age = fieldAgeMin(f);
      const valStr = f.value != null ? String(f.value).substring(0, 40) : "null";
      report += "   " + icon + " " + key + ": " + valStr + " (" + status;
      if (age !== null) report += ", " + age + "m old";
      report += ", " + f.source + ")\n";
    }
    
    report += "\n⚖️ DERIVED:\n";
    const streak = fields.funding_streak_days;
    if (streak && streak.value != null) {
      const sd = streak.value;
      report += "   Funding streak: " + (sd < 0 ? "-" : sd > 0 ? "+" : "") + Math.abs(sd) + " days (" + sd + ")\n";
    }
  }
  
  report += "\n📊 OPTIONS SENTIMENT:\n";
  const optsR = snap.options || {};
  report += "   OI PCR: " + (optsR.put_call_ratio != null ? optsR.put_call_ratio.toFixed(2) : "null") + 
            " (" + (optsR.pcr_interpretation || "") + ")\n";
  if (optsR.max_oi) {
    if (optsR.max_oi.put) report += "   Max OI Put: $" + fmtNum(optsR.max_oi.put.strike) + " (OI: " + (optsR.max_oi.put.open_interest || 0).toLocaleString() + ")\n";
    if (optsR.max_oi.call) report += "   Max OI Call: $" + fmtNum(optsR.max_oi.call.strike) + " (OI: " + (optsR.max_oi.call.open_interest || 0).toLocaleString() + ")\n";
  }
  if (ts) report += "   Term structure: " + (ts.structure || "N/A") + " (Front: " + fmtPct(ts.front_month_iv) + ", Back: " + fmtPct(ts.back_month_iv) + ")\n";
  
  report += "\n🌍 MACRO BACKDROP:\n";
  const macR = snap.macro || {};
  report += "   Fed Funds: " + fmtPct(macR.fed_funds) + "\n";
  report += "   10Y Treasury: " + fmtPct(macR.treasury_10y) + "\n";
  report += "   VIX: " + fmtNum(macR.vix, 2) + " (" + (macR.volatility_regime || "Unknown") + ")\n";
  report += "   Yield curve: " + (macR.yield_curve || "N/A") + "\n";
  
  report += "\n" + "=".repeat(60);
  
  document.getElementById("sentiment-report").textContent = report;
  
  // Footer
  document.getElementById("snapshot-source").textContent = 
    "Pi: " + (isV2 ? "self-published" : "manual") + " · schema v" + (snap._schema_version || 1);
}

load();
</script>
</body>
</html>
