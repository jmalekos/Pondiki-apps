<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pondiki Memory Pyramid</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #0d0f14; --card-bg: #14161f; --border: #1f2233;
  --text: #e0e0e0; --dim: #6b7280; --accent: #8b5cf6;
  --green: #22c55e; --yellow: #eab308; --red: #ef4444;
  --blue: #3b82f6; --cyan: #06b6d4;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; padding: 24px;
}
.header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 32px; flex-wrap: wrap; gap: 12px;
}
.header h1 { font-size: 1.8rem; font-weight: 700; }
.header h1 span { color: var(--accent); }
.header .meta { color: var(--dim); font-size: 0.85rem; }
.badge {
  display: inline-block; padding: 4px 12px; border-radius: 12px;
  font-size: 0.75rem; font-weight: 600;
}
.badge-live { background: rgba(34,197,94,0.15); color: var(--green); }
.badge-warn { background: rgba(234,179,8,0.15); color: var(--yellow); }
.badge-dead { background: rgba(239,68,68,0.15); color: var(--red); }
.grid { display: grid; gap: 20px; }
.kpi-row { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.chart-row { grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); }
.full-row { grid-template-columns: 1fr; }
.card {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: 12px; padding: 20px;
}
.card h2 {
  font-size: 1rem; font-weight: 600; margin-bottom: 16px;
  color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px;
}
.kpi {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: 12px; padding: 20px; text-align: center;
}
.kpi .value { font-size: 2.4rem; font-weight: 700; line-height: 1; margin: 8px 0; }
.kpi .label { font-size: 0.8rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; }
.kpi .sub { font-size: 0.75rem; color: var(--dim); margin-top: 4px; }
.kpi.accent .value { color: var(--accent); }
.kpi.green .value { color: var(--green); }
.kpi.blue .value { color: var(--blue); }
.kpi.cyan .value { color: var(--cyan); }
.alert-list { list-style: none; }
.alert-list li {
  padding: 10px 14px; border-radius: 8px; margin-bottom: 8px;
  font-size: 0.9rem; display: flex; align-items: center; gap: 8px;
}
.alert-list li.ok { background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.2); }
.alert-list li.warn { background: rgba(234,179,8,0.08); border: 1px solid rgba(234,179,8,0.2); }
.alert-list li.err { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.2); }
.alert-list .icon { font-size: 1.1rem; flex-shrink: 0; }
.tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  font-size: 0.75rem; padding: 3px 10px; border-radius: 8px;
  background: rgba(139,92,246,0.12); color: var(--accent);
  border: 1px solid rgba(139,92,246,0.25);
}
canvas { max-width: 100%; }
.footer {
  text-align: center; color: var(--dim); font-size: 0.75rem;
  margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--border);
}
.footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>🧠 <span>Pondiki</span> Memory Pyramid</h1>
    <div class="meta" id="timestamp"></div>
  </div>
  <div id="status-badge"></div>
</div>
<div class="grid kpi-row" id="kpi-row"></div>
<div class="grid chart-row" style="margin-top:20px">
  <div class="card"><h2>Layer Inventory</h2><canvas id="chart-inventory"></canvas></div>
  <div class="card"><h2>Coverage: Tags → Scenarios</h2><canvas id="chart-coverage"></canvas></div>
</div>
<div class="grid chart-row" style="margin-top:20px">
  <div class="card"><h2>Scenario Freshness</h2><canvas id="chart-freshness"></canvas></div>
  <div class="card"><h2>Search Sanity</h2><canvas id="chart-search"></canvas></div>
</div>
<div class="grid full-row" style="margin-top:20px">
  <div class="card"><h2>Alerts</h2><ul class="alert-list" id="alert-list"></ul></div>
</div>
<div class="grid full-row" style="margin-top:20px">
  <div class="card"><h2>Tag Distribution</h2><div class="tag-list" id="tag-list"></div></div>
</div>
<div class="footer">
  Pondiki Memory Pyramid · Generated <span id="gen-time"></span> ·
  <a href="https://github.com/jmalekos/Pondiki-apps">GitHub</a>

  "⚠️ Coverage ratio is 33.3% — most atoms lack scenarios"
 ]
};

Chart.defaults.color = '#6b7280';
Chart.defaults.borderColor = '#1f2233';
Chart.defaults.plugins.legend.labels.usePointStyle = true;
Chart.defaults.plugins.legend.labels.pointStyleWidth = 8;

const t = new Date(DATA.timestamp);
document.getElementById('timestamp').textContent = t.toLocaleString('en-US', {timeZone:'America/Los_Angeles'}) + ' PDT';
document.getElementById('gen-time').textContent = t.toISOString();

const alertCount = DATA.alerts.filter(a => !a.startsWith('\u2705')).length;
const badge = document.getElementById('status-badge');
if (alertCount === 0) {
  badge.innerHTML = '<span class="badge badge-live">Healthy</span>';
} else if (alertCount <= 2) {
  badge.innerHTML = '<span class="badge badge-warn">Needs Attention</span>';
} else {
  badge.innerHTML = '<span class="badge badge-dead">Critical</span>';
}

const kpis = [
  {label:'Atoms (L1)', value:DATA.layers.atoms.count, cls:'accent', sub:(DATA.layers.atoms.hours_since_last||0).toFixed(1)+'h ago'},
  {label:'Scenarios (L2)', value:DATA.layers.scenarios.count, cls:'blue', sub:(DATA.layers.scenarios.stale_topics||[]).length+' stale'},
  {label:'Skills', value:DATA.layers.skills.count, cls:'green', sub:(DATA.layers.skills.names||[]).join(', ')||'none'},
  {label:'Refs Offloaded', value:DATA.layers.refs.count, cls:'cyan', sub:(DATA.layers.refs.total_kb||0)+' KB'},
  {label:'Coverage', value:DATA.coverage.coverage_ratio+'%', cls:DATA.coverage.coverage_ratio >= 70 ? 'green' : DATA.coverage.coverage_ratio >= 40 ? 'blue' : 'accent', sub:'tag\u2192scenario'},
];
document.getElementById('kpi-row').innerHTML = kpis.map(k =>
  '<div class="kpi '+k.cls+'"><div class="label">'+k.label+'</div><div class="value">'+k.value+'</div><div class="sub">'+k.sub+'</div></div>'
).join('');

document.getElementById('alert-list').innerHTML = DATA.alerts.map(a => {
  const level = a.startsWith('\u2705') ? 'ok' : (DATA.alerts.length <= 2 ? 'warn' : 'err');
  const icon = a.startsWith('\u2705') ? '\u2705' : '\u26a0\ufe0f';
  return '<li class="'+level+'"><span class="icon">'+icon+'</span>'+a+'</li>';
}).join('');

const tags = DATA.layers.atoms.by_tag || {};
document.getElementById('tag-list').innerHTML = Object.entries(tags)
  .sort((a,b) => b[1] - a[1])
  .map(([tag,count]) => '<span class="tag">'+tag+' ('+count+')</span>')
  .join('');

new Chart(document.getElementById('chart-inventory'), {
  type:'bar',
  data:{
    labels:['Atoms (L1)','Scenarios (L2)','Skills (L2)','Refs'],
    datasets:[{
      label:'Count',
      data:[DATA.layers.atoms.count, DATA.layers.scenarios.count, DATA.layers.skills.count, DATA.layers.refs.count],
      backgroundColor:['rgba(139,92,246,0.6)','rgba(59,130,246,0.6)','rgba(34,197,94,0.6)','rgba(6,182,212,0.6)'],

      borderWidth:1, borderRadius:6
    }]
  },
  options:{
    responsive:true,
    plugins:{legend:{display:false}},
    scales:{
      y:{beginAtZero:true, grid:{color:'rgba(255,255,255,0.05)'}, ticks:{stepSize:1}},
      x:{grid:{display:false}}
    }
  }
});

new Chart(document.getElementById('chart-coverage'), {
  type:'doughnut',
  data:{
    labels:['Covered','Uncovered','Orphan scenarios'],
    datasets:[{
      data:[
        Math.round(DATA.coverage.coverage_ratio),
        Math.round(100 - DATA.coverage.coverage_ratio - (DATA.coverage.scenarios_without_atoms||[]).length / Math.max((DATA.layers.scenarios.count + (DATA.coverage.tags_without_scenario||[]).length), 1) * 100),
        (DATA.coverage.scenarios_without_atoms||[]).length
      ],
      backgroundColor:['rgba(34,197,94,0.7)','rgba(234,179,8,0.7)','rgba(59,130,246,0.7)'],
      borderColor:['rgba(34,197,94,1)','rgba(234,179,8,1)','rgba(59,130,246,1)'],
      borderWidth:1
    }]
  },
  options:{
    responsive:true,
    plugins:{legend:{position:'bottom', labels:{padding:16, color:'#e0e0e0'}}}
  }
});

const fresh = [...(DATA.layers.scenarios.topics||[])].sort((a,b) => b.days_since_update - a.days_since_update).slice(0,10);
new Chart(document.getElementById('chart-freshness'), {
  type:'bar',
  data:{
    labels:fresh.map(t => t.topic),
    datasets:[{
      label:'Days since update',
      data:fresh.map(t => t.days_since_update),
      backgroundColor:fresh.map(t => t.days_since_update > 90 ? 'rgba(239,68,68,0.6)' : t.days_since_update > 30 ? 'rgba(234,179,8,0.6)' : 'rgba(34,197,94,0.6)'),

</html>
